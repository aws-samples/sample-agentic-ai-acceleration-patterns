#
# Spike SD-1, platform side: one cross-account observability sink that accepts metric links
# from one named account (stress ADR-0022, docs/stress-dashboard.design.md section 12).
AWSTemplateFormatVersion: '2010-09-09'
Description: Stress dashboard spike SD-1, the sink in the platform account
Parameters:
  CellAccountId:
    Type: String
    AllowedPattern: '^[0-9]{12}$'
Resources:
  Sink:
    Type: AWS::Oam::Sink
    Properties:
      Name: StressDashSpikeSink
      Policy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref CellAccountId
            Resource: !Sub 'arn:${AWS::Partition}:oam:${AWS::Region}:${AWS::AccountId}:sink/*'
            Action:
              - oam:CreateLink
              - oam:UpdateLink
            Condition:
              ForAllValues:StringEquals:
                oam:ResourceTypes:
                  - AWS::CloudWatch::Metric
Outputs:
  SinkArn:
    Value: !GetAtt Sink.Arn
