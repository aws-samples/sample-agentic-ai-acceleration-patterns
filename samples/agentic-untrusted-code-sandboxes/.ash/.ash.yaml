# ASH (Automated Security Helper) v3 config for this sample.
# Run from samples/agentic-untrusted-code-sandboxes:
#   ash --mode local --source-dir . --output-dir .ash/ash_output
#
# ignore_paths: machine output that is not committed (ASH does not read .gitignore).
project_name: agentic-untrusted-code-sandboxes
fail_on_findings: true
global_settings:
  severity_threshold: MEDIUM
  ignore_paths:
    - path: node_modules/**
      reason: Third-party dependencies; npm-audit covers them from package-lock.json.
    - path: cdk.out/**
      reason: CDK synth output, regenerated by `npx projen build`, gitignored.
    - path: cdk.integ.out/**
      reason: Integ cloud assembly, gitignored.
    - path: lib/**
      reason: tsc output and the handler tree copied from src/ and runner/, gitignored.
  suppressions:
    - rule_id: SECRET-*
      path: runner/protocol/vectors.json
      reason: Fixed wire-protocol test vectors (runner/PROTOCOL.md, ADR-0025) made from public byte patterns; HMACs and hashes of synthetic inputs, no secret.
    - rule_id: CKV_SECRET_6
      path: runner/protocol/vectors.json
      reason: Fixed wire-protocol test vectors (ADR-0025); synthetic values, no secret.
    - rule_id: SECRET-*
      path: test/*
      reason: Synthetic test credentials ('AKIAEXAMPLE', 'example') for the in-memory FakeBackend; never used against AWS.
    - rule_id: CKV_DOCKER_3
      path: runner/*
      reason: The runner runs as root inside the per-tenant VM by design and starts tenant code as uid 1001 with fixed limits (spec 3.5, ADR-0010); a USER line would stop it dropping privileges and setting rlimits.
    - rule_id: dockerfile.security.missing-user*
      path: runner/*
      reason: As CKV_DOCKER_3, the runner is root in the sandbox VM and runs tenant code as uid 1001 (spec 3.5, ADR-0010).
    - rule_id: CKV_DOCKER_2
      path: runner/*
      reason: The platforms probe health themselves (AgentCore and the MicroVM GET /ping, ECS task state, spec 3.4); the image needs no HEALTHCHECK, which Lambda MicroVMs and AgentCore ignore.
