# ASH (Automated Security Helper) v3 config for this sample.
# Run from samples/agentic-runtime-isolation:
#   ash --mode local --source-dir . --output-dir .ash/ash_output
#
# ignore_paths: machine output that is not committed (ASH does not read .gitignore).
project_name: agentic-runtime-isolation
fail_on_findings: true
global_settings:
  severity_threshold: MEDIUM
  ignore_paths:
    - path: node_modules/**
      reason: Third-party dependencies; npm-audit covers them from package-lock.json.
    - path: cdk.out/**
      reason: CDK synth output, regenerated by `npx projen build`, gitignored.
    - path: cdk.integ.out/**
      reason: Integ cloud assembly from scripts/integ.sh, gitignored.
    - path: lib/**
      reason: tsc output, gitignored.
    - path: coverage/**
      reason: Jest coverage report, gitignored.
    - path: test-reports/**
      reason: Jest JUnit report, gitignored.
    - path: .holmes/**
      reason: Holmes MCP local project link, gitignored.
    - path: TODO.md
      reason: Gitignored working notes.
  suppressions:
    # detect-secrets: tests use synthetic credentials and fixed unit ids only.
    - rule_id: SECRET-*
      path: test/*
      reason: Synthetic test data only ('ASIA-SYNTHETIC', 'synthetic-secret', fixed s-<base32> unit ids, a fake table item). No real credentials.
    - rule_id: SECRET-BASE64-HIGH-ENTROPY-STRING
      path: src/shared/session.ts
      reason: The RFC 4648 base32 alphabet constant used to encode session ids. Not a secret.
