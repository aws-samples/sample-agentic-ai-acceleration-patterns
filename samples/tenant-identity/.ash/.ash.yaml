# ASH (Automated Security Helper) v3 config for this sample.
# Run from samples/tenant-identity:
#   ash --mode local --source-dir . --output-dir .ash/ash_output
#
# ignore_paths: machine output that is not committed (ASH does not read .gitignore).
# suppressions: reviewed findings that are false positives or by design. Each one
# names the rule and the file, and says why. Review them whenever the file changes.
project_name: tenant-identity
fail_on_findings: true
global_settings:
  severity_threshold: MEDIUM
  ignore_paths:
    - path: node_modules/**
      reason: Third-party dependencies; npm-audit covers them from package-lock.json.
    - path: cdk.out/**
      reason: CDK synth output, regenerated by `npx projen build`, gitignored.
    - path: cdk.integ.out/**
      reason: Integ cloud assembly from scripts/integ.sh, gitignored.
    - path: src/smithy/**
      reason: Smithy-generated SSDKs and OpenAPI documents, regenerated by `smithy build`, gitignored.
    - path: lib/**
      reason: tsc output, gitignored.
    - path: coverage/**
      reason: Jest coverage report, gitignored.
    - path: test-reports/**
      reason: Jest JUnit report, gitignored.
    - path: .holmes/**
      reason: Holmes MCP local project link, gitignored.
    - path: .kiro/**
      reason: Local agent config, gitignored.
  suppressions:
    # detect-secrets: tests use synthetic credentials, ULID tenant ids and fake API key values only.
    - rule_id: SECRET-*
      path: test/*
      reason: Synthetic test data only (ULID tenant ids, 'synthetic-secret', 'Synthetic-Pass-1!', fake API key values). No real credentials.
    # detect-secrets in source: identifiers and constants, not secret values.
    - rule_id: SECRET-SECRET-KEYWORD
      path: src/shared/openapi.ts
      reason: Constant names for the API Gateway api-key-source extension and security scheme ('AUTHORIZER', 'api_key'). Not secrets.
    - rule_id: SECRET-SECRET-KEYWORD
      path: src/identity.cdk.ts
      reason: IAM resource ARNs for API Gateway /apikeys and /tags (ADR-0025). Not secrets.
    - rule_id: SECRET-SECRET-KEYWORD
      path: src/tenant-api/tenant-authorizer.ts
      reason: Type check on the registry field name apiKeyValue. The value is read at runtime, never hard-coded.
    - rule_id: SECRET-*
      path: src/topology/cognito-users.ts
      reason: Cognito error name 'InvalidPasswordException' and the character sets used to generate random temporary passwords. No password is hard-coded.
    - rule_id: SECRET-SECRET-KEYWORD
      path: scripts/demo.sh
      reason: Throwaway demo password built per run from RUN_ID for a synthetic user in a sandbox stack.
    - rule_id: SECRET-SECRET-KEYWORD
      path: threat-model.md
      reason: Prose describing per-tenant API keys (M-29). Not a secret.
    # semgrep: synth-time path built from fixed strings.
    - rule_id: javascript.lang.security.audit.path-traversal.path-join-resolve-traversal.path-join-resolve-traversal
      path: src/identity.cdk.ts
      reason: Path built at CDK synth from __dirname and fixed projection/service names in code. No user input reaches it.
